name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  # livereg (below) only runs off these two triggers, never push/pull_request —
  # it stands up real registry:2.8.3/3.1.1 containers and is weekly-or-on-demand
  # by design (#228), not a PR gate.
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch: {}

env:
  # The podman v5 bindings transitively pull in the storage graph drivers
  # (btrfs, devicemapper) and gpgme, which need CGO + system -dev headers.
  # We use only the remote libpod client, so we exclude those drivers and
  # swap gpgme for pure-Go OpenPGP. Keep in sync with the Makefile's TAGS.
  GO_TAGS: "containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_devicemapper"

jobs:
  lint-test-build:
    name: lint, test, build
    # Keep this off the schedule/workflow_dispatch triggers added for livereg
    # (below) — those exist solely to run livereg weekly/on-demand, not to
    # make every job in this workflow do so.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: self-hosted
    container:
      # Pin a recent Go. The GO_TAGS above exclude the CGO graph drivers so no
      # libbtrfs/libgpgme/libdevmapper headers are required; nodejs and the C
      # toolchain are installed in the first step below.
      image: docker.io/library/golang:1.26-bookworm

    steps:
      # Must run BEFORE any `uses:` step. actions/checkout and actions/cache are
      # JavaScript actions that the runner executes with `node`, which the
      # golang image does not ship — without this the job fails with
      # "executable file `node` not found in $PATH". `run:` steps use the shell,
      # not node, so this one is safe to run first. build-essential supplies the
      # C toolchain the race detector's linker needs.
      - name: install system deps (nodejs for JS actions + C toolchain)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs git ca-certificates build-essential

      - name: checkout
        uses: actions/checkout@v4

      - name: go env
        run: |
          go version
          go env GOMODCACHE GOCACHE

      - name: cache go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet -tags "$GO_TAGS" ./...

      # The integration suite is behind a build tag, so the steps above never
      # compile it — its call sites silently rot against signature changes
      # until the podman-in-podman job builds it, and that job is slow, needs
      # a privileged runner, and only runs after everything else. Vetting with
      # the tag needs no podman socket and catches the drift here instead.
      - name: go vet (integration-tagged code compiles)
        run: go vet -tags "$GO_TAGS integration" ./...

      - name: gofmt -l (fail on any unformatted file)
        run: |
          # Print the diff for clarity, then fail if any output is produced.
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::the following files need gofmt:"
            echo "$out"
            gofmt -d .
            exit 1
          fi

      - name: go test -race
        run: go test -tags "$GO_TAGS" -race ./...

      - name: go build
        run: go build -tags "$GO_TAGS" ./...

  integration:
    name: integration (podman-in-podman)
    # Same reasoning as lint-test-build above: this needs a privileged
    # self-hosted runner and runs ~2min of nested-podman suites, so it must
    # not also fire on the schedule/workflow_dispatch triggers that exist for
    # livereg.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: self-hosted
    container:
      # Fedora-based image that ships podman, catatonit and netavark and is
      # built to run podman nested. --privileged is required for nested podman
      # (storage + the networking that `podman play kube` hostPort bindings
      # need). If the runner forbids privileged jobs this step fails fast and
      # the runner config needs to allow it.
      image: quay.io/podman/stable
      options: --privileged
    env:
      # Rootful podman serves its API socket under $XDG_RUNTIME_DIR/podman; the
      # integration tests look for $XDG_RUNTIME_DIR/podman/podman.sock.
      XDG_RUNTIME_DIR: /run
      # vfs needs no /dev/fuse or overlay support, so it works regardless of how
      # the outer runner is configured. Slower than overlay but the test images
      # (alpine) are tiny.
      STORAGE_DRIVER: vfs
      # Opt into the host-wide prune scopes (image/container/build-cache). The
      # gate exists so `make test-integration` on a developer's machine never
      # reaps their state; this fixture is fresh and disposable, so it should
      # exercise every scope. See TestReal_Prune_HostWide_LocalOnly.
      PODMAN_API_ITEST_PRUNE_DESTRUCTIVE: "1"
    steps:
      # nodejs is needed by the JS-based actions/checkout; go.mod pins go 1.26
      # which Go's GOTOOLCHAIN auto-fetches on top of Fedora's older toolchain.
      - name: install go + nodejs
        run: |
          dnf -y install golang nodejs git make >/dev/null
          go version

      - name: checkout
        uses: actions/checkout@v4

      - name: cache go modules + toolchain
        uses: actions/cache@v4
        with:
          # Caching ~/go/pkg/mod also caches the Go 1.26 toolchain that
          # GOTOOLCHAIN fetches on top of Fedora's golang (it lands under
          # pkg/mod/golang.org/toolchain), so repeat runs skip both downloads.
          # Distinct key namespace from the lint-test-build job: different image
          # and build tags, so its build cache must not be shared.
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-integration-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-integration-${{ runner.os }}-

      - name: start podman services
        run: |
          # First socket (source host for evacuate tests)
          podman system service --time=0 unix:///run/podman/podman.sock &
          for i in $(seq 1 30); do
            [ -S /run/podman/podman.sock ] && break
            sleep 1
          done
          podman info >/dev/null
          podman --version

          # Second socket (destination host for evacuate tests) with separate
          # storage so the two podman instances do not share state.
          mkdir -p /tmp/podman2
          podman --root /tmp/podman2/root --runroot /tmp/podman2/run \
            system service --time=0 unix:///tmp/podman2/podman2.sock &
          for i in $(seq 1 30); do
            [ -S /tmp/podman2/podman2.sock ] && break
            sleep 1
          done
          [ -S /tmp/podman2/podman2.sock ] || { echo "podman2 socket did not appear"; exit 1; }
          podman --url unix:///tmp/podman2/podman2.sock info >/dev/null

      - name: integration tests
        # Explicit -timeout so a nested-podman hang fails clearly instead of
        # blocking on the 10m default; the two suites take ~2min each locally.
        run: go test -tags "$GO_TAGS integration" -timeout=10m ./internal/podman/... ./cmd/podman-api/...

  livereg:
    name: livereg (imgregistry, real distribution servers)
    # #228: internal/imgregistry/livereg_test.go pins two `distribution`-server
    # behaviors (manifestAccept vs. `Accept: */*` content negotiation, and
    # 2.8.x's fabricated schema1 down-convert digest) that only real registry
    # containers can disprove — a fake can't regress against them. It is
    # build-tagged `livereg` so `make test`/the jobs above never run it; this
    # job exists to keep it from silently rotting while looking green. Weekly
    # or on-demand, deliberately not a push/pull_request gate: it stands up
    # two registry containers and pushes real images, which is slower and
    # noisier than we want on every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    container:
      # Same nested-podman image as the integration job above: we need real
      # `podman run`/`build`/`push` against loopback registries, not just the
      # remote libpod client this repo otherwise uses.
      image: quay.io/podman/stable
      options: --privileged
    steps:
      - name: install go + nodejs
        run: |
          dnf -y install golang nodejs git make curl >/dev/null
          go version

      - name: checkout
        uses: actions/checkout@v4

      - name: cache go modules + toolchain
        uses: actions/cache@v4
        with:
          # Distinct key namespace: different image/tags than lint-test-build,
          # same as the integration job's reasoning above.
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-livereg-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-livereg-${{ runner.os }}-

      # Recipe below is exactly the header comment of livereg_test.go — keep
      # the two in sync; the test's port numbers (5999/5998) are hardcoded in
      # liveRegs in that file, not parameterized here.
      - name: start registry:2.8.3 and registry:3.1.1
        run: |
          podman run -d --name reg283 -p 5999:5000 docker.io/library/registry:2.8.3
          podman run -d --name reg311 -p 5998:5000 docker.io/library/registry:3.1.1
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5999/v2/ >/dev/null 2>&1 \
              && curl -sf http://127.0.0.1:5998/v2/ >/dev/null 2>&1 \
              && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5999/v2/ >/dev/null
          curl -sf http://127.0.0.1:5998/v2/ >/dev/null

      - name: build + push the four probe images
        run: |
          set -e
          mkdir -p /tmp/probe && cd /tmp/probe
          printf 'FROM scratch\nCOPY hello.txt /hello.txt\n' > Dockerfile
          echo hi > hello.txt
          podman build -t probe:local .
          for R in 5999 5998; do
            podman push --tls-verify=false --format docker localhost/probe:local 127.0.0.1:$R/probe:v2
            podman push --tls-verify=false --format oci    localhost/probe:local 127.0.0.1:$R/probe:oci
            podman push --tls-verify=false --format docker localhost/probe:local 127.0.0.1:$R/live:latest
            podman push --tls-verify=false --format docker localhost/probe:local 127.0.0.1:$R/live:abc1234
          done

      - name: go test (livereg)
        run: go test -tags "$GO_TAGS livereg" -run LiveReg -v ./internal/imgregistry/

      - name: stop registries
        if: always()
        run: podman rm -f reg283 reg311 || true
