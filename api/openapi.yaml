        overriding only the image, then re-applies with replace. Unlike
        /upgrade this requires no secrets in the request — the sealed secrets are
        unrecoverable plaintext and never need to be re-supplied — so an
        unattended bearer-auth loop can roll many instances to a new image
        without an operator login. A per-instance secret the template added after
        deploy does not block the upgrade (the missing secret was already
        missing).
      parameters:
        - {$ref: '#/components/parameters/HostID'}
        - {$ref: '#/components/parameters/TemplateID'}
        - {$ref: '#/components/parameters/Slug'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpgradeImageRequest'}}}
      responses:
        '200':
          description: upgraded
          content: {application/json: {schema: {$ref: '#/components/schemas/Observed'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/UpstreamError'}
      x-required-scope: instances:write

  /hosts/{host}/instances/{template}/{slug}/parameters:
    patch:
      tags: [lifecycle]
      summary: change render parameters, reusing the instance's sealed secrets
      description: >-
        Overlays the supplied parameters onto the instance's stored spec and
        re-applies with replace, reusing the sealed per-instance secrets and the
        persisted domains unchanged. Parameter names absent from the request keep
        their stored value; a parameter cannot be deleted through this route (use
        PUT, which requires every secret). Requires no secrets in the request —
        the sealed values are unrecoverable plaintext an operator cannot read back,
        so before this route a parameter change on such an instance was impossible.
        A per-instance secret the template added after deploy does not block the
        update (the missing secret was already missing). `slug` cannot be changed
        through this route (400 invalid_body); use the rename route instead. This
        route replaces the pod, so a parameter change that renders a manifest
        podman refuses can leave the instance down until a boot converge or a
        manual re-apply.
      parameters:
        - {$ref: '#/components/parameters/HostID'}
        - {$ref: '#/components/parameters/TemplateID'}
        - {$ref: '#/components/parameters/Slug'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateParametersRequest'}}}
      responses:
        '200':
          description: updated
          content: {application/json: {schema: {$ref: '#/components/schemas/Observed'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/UpstreamError'}
      x-required-scope: instances:write

  /hosts/{host}/instances/{template}/{slug}/secrets:
    patch:
      tags: [lifecycle]
      summary: add or rotate per-instance secrets, keeping the sealed ones you omit
      description: >-
        Merges the supplied secrets into the instance's stored sealed
        per-instance secrets and re-applies with replace, reusing the stored
        parameters and persisted domains unchanged. Names absent from the request
        keep their stored value, so a secret the template gained after deploy can
        be added without resupplying secrets whose plaintext is sealed and
        unreadable — the full-spec PUT demands every declared secret, which is
        impossible on such an instance. A secret cannot be deleted through this
        route (use PUT, which requires the full set), so an empty value is
        rejected with 400 invalid_body rather than wiping an unrecoverable
        secret. Values are request-only: nothing here is ever read back, and the
        response is the usual Observed. A name the template does not declare is
        rejected (400 invalid_parameters). This route replaces the pod, so a
        re-apply podman refuses can leave the instance down until a boot converge
        or a manual re-apply.
      parameters:
        - {$ref: '#/components/parameters/HostID'}
        - {$ref: '#/components/parameters/TemplateID'}
        - {$ref: '#/components/parameters/Slug'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateSecretsRequest'}}}
      responses:
        '200':
          description: updated
          content: {application/json: {schema: {$ref: '#/components/schemas/Observed'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/UpstreamError'}
      x-required-scope: instances:write

