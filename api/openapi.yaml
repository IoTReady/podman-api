  /registry/repos:
    get:
      tags: [registry]
      summary: list every repository in the configured registry (Registry v2 catalog)
      description: >-
        404 when no registry client is configured (-registry-* flags), the
        same "absent, not disabled" shape as every other route under
        /registry.
      responses:
        '200':
          description: repository names
          content:
            application/json:
              schema: {type: array, items: {type: string}}
        '404':
          description: registry browsing is not configured
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502': {$ref: '#/components/responses/UpstreamError'}
      x-required-scope: instances:read

  /registry/repos/{repo}:
    get:
      tags: [registry]
      summary: list a repository's tags, or resolve a single tag/digest's manifest
      description: >-
        With no query string, lists every tag in `repo` grouped by content
        digest. With `?manifest=<ref>`, resolves that one tag or digest
        instead and returns its manifest. Both are served by this one route
        because Go 1.22's `{repo...}` multi-segment wildcard — required so a
        "/"-containing repo name (e.g. `iotready/engine`) is addressable at
        all — must be the mux's last path segment, ruling out a separate
        `.../manifests/{ref}` route. `repo` itself may contain further `/`
        segments (e.g. `iotready/engine`). 404 when no registry client is
        configured, same as GET /registry/repos. A genuine registry 404 (no
        such repo/tag/digest) and a registry that could not be reached are
        never collapsed into the same status: the former is 404 not_found,
        the latter is 502 registry_unreachable.
      parameters:
        - name: repo
          in: path
          required: true
          description: repository name; may contain additional "/" segments
          schema: {type: string}
        - name: manifest
          in: query
          required: false
          description: a tag or a digest (algorithm:hex); when set, returns that ref's manifest instead of the tag listing
          schema: {type: string}
      responses:
        '200':
          description: tag groups (no `manifest` query param), or one manifest (`manifest` set)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: '#/components/schemas/RegistryTagGroup'}
                  - $ref: '#/components/schemas/RegistryManifest'
        '400':
          description: invalid repo name, or an invalid `manifest` value (must be a tag or a digest)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: registry browsing is not configured, or (once configured) no such repo/tag/digest (code not_found)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502': {$ref: '#/components/responses/UpstreamError'}
      x-required-scope: instances:read

  /registry/prune:
    post:
      tags: [registry]
      summary: enqueue an on-demand registry prune run (#219)
      description: >-
        Classifies every manifest in the configured registry against live
        fleet inventory and stored specs, then unlinks the ones that are
        unreferenced and safely recreatable, failing closed on any doubt
        (e.g. a truncated inventory sweep). Whether the run is dry-run, its
        deletion policy, and whether blob GC (Stage B) runs are all fixed
        server-side flags (-registry-prune-*) — the request body is empty,
        so a caller cannot turn a dry-run deployment into a deleting one over
        HTTP. Read the run's progress via GET /jobs/{job_id}. 404 when the
        feature is not enabled (-registry-prune-enabled), the same
        "absent, not disabled" shape as the browse routes above. 409 when a
        run is already in flight — the scheduler's own guard against two
        runs classifying (and mutating) the same catalog concurrently; this
        is deliberately not a 202 carrying the in-flight job's id, since
        "your run started" and "someone else's run is still going" are
        different answers.
      responses:
        '202':
          description: prune job accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAccepted'}
        '404':
          description: registry prune is not configured (-registry-prune-enabled)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: a prune run is already in flight (registryprune.ErrRunInFlight)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-required-scope: instances:write

