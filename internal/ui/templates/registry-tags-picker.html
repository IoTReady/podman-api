{{define "registry-tags-picker"}}
<table class="tbl">
  <thead><tr><th>Tags</th><th>Digest</th><th>Created</th><th></th></tr></thead>
  <tbody>
  {{range .Groups}}
    <tr>
      <td data-label="Tags">{{range $i, $t := .Tags}}{{if $i}}, {{end}}<code>{{$t}}</code>{{end}}</td>
      <td data-label="Digest" class="idcell"><code>{{.Digest}}</code></td>
      <td data-label="Created">{{.Created.Format "2006-01-02 15:04"}}</td>
      <td><button type="button" class="btn ghost" onclick="document.getElementById('upgrade-image-input').value='{{$.Repo}}@{{.Digest}}'">Use</button></td>
    </tr>
  {{else}}
    <tr><td colspan="4" class="sub">No tags found.</td></tr>
  {{end}}
  </tbody>
</table>
{{end}}
